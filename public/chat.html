<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — SocialHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0e27; color: #e4e6eb; }
    
    .container { display: flex; height: 100vh; }
    .sidebar { width: 320px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; }
    .sidebar-header h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; }
    .back-btn { color: #60a5fa; cursor: pointer; font-size: 0.9rem; }
    .conversations-list { flex: 1; overflow-y: auto; }
    .conversation-item { padding: 12px 16px; border-bottom: 1px solid #1f2937; cursor: pointer; transition: background 0.2s; }
    .conversation-item:hover { background: #1f2937; }
    .conversation-item.active { background: #2d3748; border-left: 4px solid #60a5fa; }
    .conv-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .conv-preview { color: #9ca3af; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { color: #6b7280; font-size: 0.75rem; }
    .unread-badge { display: inline-block; background: #ef4444; color: white; padding: 2px 6px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; }

    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { font-size: 1.1rem; font-weight: 700; }
    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 8px; animation: slideIn 0.3s ease; }
    .message.own { justify-content: flex-end; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message-bubble { max-width: 60%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; }
    .message.own .message-bubble { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 16px 4px 16px 16px; }
    .message.other .message-bubble { background: #1f2937; color: #e4e6eb; border-radius: 4px 16px 16px 16px; }
    .message-time { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }

    .empty-state { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #9ca3af; }
    .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; }

    .compose-area { padding: 16px 20px; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
    .compose-area input { flex: 1; padding: 10px 12px; border: 1px solid #374151; border-radius: 20px; background: #111827; color: #e4e6eb; font-size: 0.95rem; }
    .compose-area input:focus { outline: none; border-color: #667eea; }
    .compose-area button { padding: 10px 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    .compose-area button:hover { opacity: 0.9; }

    .no-chat { display: flex; align-items: center; justify-content: center; height: 100%; }
    .no-chat p { color: #9ca3af; text-align: center; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; max-height: 200px; flex-direction: row; overflow-x: auto; }
      .conversations-list { flex-direction: row; }
      .chat-area { display: none; }
      .chat-area.mobile-show { display: flex; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Sidebar: Conversations List -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Messages</h1>
      <a href="/" class="back-btn">← Back to feed</a>
    </div>
    <div class="conversations-list" id="conversations-list">
      <div style="padding: 20px; text-align: center; color: #9ca3af;">Loading...</div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chat-area">
    <div class="no-chat">
      <p>Select a conversation to start chatting</p>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('token') || '';
let currentChatUserId = null;
let currentChatUserName = null;

if (!token) {
  window.location.href = '/';
}

function authHeaders() {
  return { Authorization: 'Bearer ' + token };
}

async function loadConversations() {
  try {
    const res = await fetch(`${API}/chat`, { headers: authHeaders() });
    const data = await res.json();
    const list = document.getElementById('conversations-list');

    if (!data.data || data.data.length === 0) {
      list.innerHTML = '<div style="padding: 20px; text-align: center; color: #9ca3af;">No conversations yet</div>';
      return;
    }

    list.innerHTML = data.data
      .map(
        (conv) => `
      <div class="conversation-item" onclick="openChat('${conv.user._id}', '${conv.user.first_name} ${conv.user.last_name}')">
        <div style="display: flex; justify-content: space-between;">
          <div class="conv-name">${conv.user.first_name} ${conv.user.last_name}</div>
          ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
        </div>
        <div class="conv-preview">${conv.lastMessage}</div>
        <div class="conv-time">${getTimeAgo(new Date(conv.lastMessageTime))}</div>
      </div>
    `
      )
      .join('');
  } catch (err) {
    console.error(err);
  }
}

async function openChat(userId, userName) {
  currentChatUserId = userId;
  currentChatUserName = userName;

  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = `
    <div class="chat-header">
      <h2>${userName}</h2>
      <button onclick="closeChat()" style="background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1.2rem;">✕</button>
    </div>
    <div class="messages-container" id="messages"></div>
    <div class="compose-area">
      <input id="message-input" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  `;

  document.getElementById('message-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  loadMessages();
  setInterval(() => loadMessages(), 2000); // Poll for new messages
}

async function loadMessages() {
  if (!currentChatUserId) return;

  try {
    const res = await fetch(`${API}/chat/${currentChatUserId}`, { headers: authHeaders() });
    const data = await res.json();

    const container = document.getElementById('messages');
    if (!container) return;

    container.innerHTML = (data.data || [])
      .map((msg) => {
        const isOwn = msg.sender._id === (JSON.parse(atob(token.split('.')[1]))).id;
        const timeAgo = getTimeAgo(new Date(msg.createdAt));
        return `
        <div class="message ${isOwn ? 'own' : 'other'}">
          <div>
            <div class="message-bubble">${escapeHtml(msg.text)}</div>
            <div class="message-time">${timeAgo}</div>
          </div>
        </div>
      `;
      })
      .join('');

    container.scrollTop = container.scrollHeight;
  } catch (err) {
    console.error(err);
  }
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();

  if (!text || !currentChatUserId) return;

  try {
    const res = await fetch(`${API}/chat/${currentChatUserId}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text }),
    });

    if (res.ok) {
      input.value = '';
      loadMessages();
      loadConversations();
    }
  } catch (err) {
    console.error(err);
  }
}

function closeChat() {
  currentChatUserId = null;
  document.getElementById('chat-area').innerHTML =
    '<div class="no-chat"><p>Select a conversation to start chatting</p></div>';
}

function getTimeAgo(date) {
  const now = new Date();
  const secs = Math.floor((now - date) / 1000);
  if (secs < 60) return 'now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h';
  const days = Math.floor(hours / 24);
  return days + 'd';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

loadConversations();
</script>

</body>
</html>
